<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experimento 1 - Gestão de Produtos</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="exp1.js">
</head>
<body>
  <div class="container">
    <h1>Experimento 1: Produtos</h1>
    
    <form id="form-produto" class="card">
      <h2>Cadastrar Produto</h2>
      <div class="form-group">
        <label for="nome">Nome do Produto</label>
        <input type="text" id="nome" required placeholder="Ex: Teclado">
      </div>
      <div class="form-group">
        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" min="0" required placeholder="Ex: 150.00">
      </div>
      <div class="form-group">
        <label for="estoque">Estoque</label>
        <input type="number" id="estoque" min="0" required placeholder="Ex: 10">
      </div>
      <button type="submit" class="btn">Cadastrar e Validar</button>
    </form>

    <div class="card">
      <h2>Produtos com Estoque (> 0)</h2>
      <ul id="lista-aprovados" class="lista"></ul>
    </div>

    <div class="grid-resumo">
      <div class="card-info">
        <h3>Lista Apenas com Nomes</h3>
        <p id="resumo-nomes">-</p>
      </div>
      <div class="card-info">
        <h3>Valor Total em Estoque</h3>
        <p id="resumo-total">R$ 0,00</p>
      </div>
      <div class="card-info">
        <h3>Produto Mais Caro</h3>
        <p id="resumo-mais-caro">-</p>
      </div>
    </div>
  </div>

</body>
</html>
